<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vitrova · Consultas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--esp:#33261F;--tab:#6B5040;--alu:#A3A7AB;--gra:#5E6266;--pie:#E9E4DD;--mar:#F4F1EC}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--mar);color:var(--esp);font:300 15px/1.5 Montserrat,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(4vw,16px);background:#fff;border-bottom:1px solid rgba(51,38,31,.1);position:sticky;top:0;z-index:5}
header img{height:36px}
.wrap{max-width:1240px;margin:0 auto;padding:28px max(4vw,16px)}
h1{font-weight:300;font-size:30px;margin:0 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border:1px solid var(--esp);background:var(--esp);color:var(--mar);font:500 14px Montserrat,sans-serif;cursor:pointer;text-decoration:none;border-radius:2px}
.btn.line{background:transparent;color:var(--esp)}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e}
.login{max-width:380px;margin:12vh auto;background:#fff;padding:32px;box-shadow:0 24px 50px -32px rgba(51,38,31,.4)}
.login img{height:40px;margin-bottom:22px}
label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
input,select{width:100%;font:400 16px Montserrat,sans-serif;padding:12px;border:1px solid rgba(51,38,31,.2);background:var(--mar);border-radius:2px}
.err{color:#9b2c1f;font-size:13.5px;margin-top:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 0 22px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.f{font:400 14px Montserrat,sans-serif;background:#fff;border:1px solid rgba(51,38,31,.2);padding:8px 14px;cursor:pointer;border-radius:2px}
.f[aria-pressed=true]{background:var(--esp);color:var(--mar);border-color:var(--esp)}
.list{display:grid;gap:16px}
.card{background:#fff;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;padding:20px;box-shadow:0 14px 30px -24px rgba(51,38,31,.5)}
.imgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.imgs figure{margin:0}
.imgs img{width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in;background:var(--pie)}
.imgs figcaption{font-size:12px;color:var(--gra);margin-top:4px}
.noimg{display:flex;align-items:center;justify-content:center;aspect-ratio:2/1;background:var(--pie);color:var(--gra);font-size:13px;grid-column:1/-1}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-size:20px;font-weight:400}
.date{font-size:12.5px;color:var(--gra);white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;font-weight:500;letter-spacing:.04em;padding:3px 9px;margin-top:6px;text-transform:uppercase}
.p-nueva{background:#E9D9C9;color:var(--tab)}.p-contactada{background:#DDE7E7;color:#3d5a5c}.p-cerrada{background:#E4E6E2;color:#4f5a4b}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:14px 0;font-size:14px}
dt{color:var(--gra)}dd{margin:0;font-weight:400}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.empty{background:#fff;padding:40px;text-align:center;color:var(--gra)}
.zoom{position:fixed;inset:0;background:rgba(20,15,12,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%}
@media(max-width:760px){.card{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

  <main class="wrap">
    <h1>Consultas</h1>
    <p style="color:#5E6266;margin:0" id="count"></p>
    <div class="bar">
      <div class="filters" id="filters"></div>
      <input id="q" placeholder="Buscar por nombre, ciudad o teléfono" style="max-width:320px">
    </div>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="zoom" id="zoom" hidden><img alt="Imagen ampliada"></div>

<script>window.addEventListener("unhandledrejection",()=>{const e=document.getElementById("lerr");e.hidden=false;e.textContent="No se pudo conectar con Firebase. Revisá tu conexión y recargá la página.";});</script>
<script type="module">
  // Pegá acá la MISMA configuración que en la landing
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCBzPsYFF3UiFqd57RfTJnw4vMGk5eA5Ew",
    authDomain: "vitrova-5ee6f.firebaseapp.com",
    projectId: "vitrova-5ee6f",
    storageBucket: "vitrova-5ee6f.firebasestorage.app",
    messagingSenderId: "159754036602",
    appId: "1:159754036602:web:aa1ca711c8576c3b28e2c3",
    measurementId: "G-GGM3D67JBQ"
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if (!FIREBASE_CONFIG) {
    $('app').hidden = true; $('lerr').hidden = false; $('lerr').textContent = 'Falta pegar la configuración de Firebase en este archivo (FIREBASE_CONFIG).';
  } else {
    const V = '10.12.2';
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, updateDoc } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = initializeApp(FIREBASE_CONFIG), db = getFirestore(app);
    let rows = [], filtro = 'todas';
    const ESTADOS = ['todas', 'nueva', 'contactada', 'cerrada'];
    $('filters').innerHTML = ESTADOS.map(e => `<button class="f" data-e="${e}" aria-pressed="${e === filtro}">${e[0].toUpperCase() + e.slice(1)}</button>`).join('');
    $('filters').addEventListener('click', e => { const b = e.target.closest('.f'); if (!b) return; filtro = b.dataset.e; document.querySelectorAll('.f').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
    $('q').addEventListener('input', draw);

    onSnapshot(query(collection(db, 'consultas'), orderBy('creado', 'desc'), limit(200)),
      snap => { rows = snap.docs.map(d => ({ id: d.id, ...d.data() })); draw(); },
      err => { $('list').innerHTML = `<div class="empty">No se pudieron leer las consultas. Revisá las reglas de Firestore.<br><small>${esc(err.code)}</small></div>`; });

    const waNum = t => { let d = String(t || '').replace(/\D/g, ''); if (d.startsWith('0')) d = d.slice(1); if (d.startsWith('15')) d = d.slice(2); if (!d.startsWith('54')) d = '549' + d; return d; };
    function draw() {
      const q = $('q').value.trim().toLowerCase();
      const vis = rows.filter(r => (filtro === 'todas' || (r.estado || 'nueva') === filtro) &&
        (!q || [r.nombre, r.ciudad, r.tel, r.email].join(' ').toLowerCase().includes(q)));
      $('count').textContent = `${vis.length} de ${rows.length} consultas`;
      if (!vis.length) { $('list').innerHTML = '<div class="empty">No hay consultas para mostrar.</div>'; return; }
      $('list').innerHTML = vis.map(r => {
        const f = r.creado && r.creado.toDate ? r.creado.toDate().toLocaleString('es-AR', {dateStyle:'medium', timeStyle:'short'}) : '';
        const est = r.estado || 'nueva';
        const msg = encodeURIComponent(`Hola ${r.nombre || ''}, te escribimos de Vitrova por tu consulta de ${(r.modelo_probado || r.tipo || 'mampara').toLowerCase()}.`);
        const imgs = r.foto || r.simulacion
          ? `${r.foto ? `<figure><img src="${r.foto}" alt="Foto del baño"><figcaption>Foto del cliente</figcaption></figure>` : ''}${r.simulacion ? `<figure><img src="${r.simulacion}" alt="Simulación"><figcaption>Simulación: ${esc(r.modelo_probado)} · ${esc(r.herrajes)}</figcaption></figure>` : ''}`
          : '<div class="noimg">Consulta sin foto</div>';
        return `<article class="card"><div class="imgs">${imgs}</div><div>
          <div class="top"><span class="name">${esc(r.nombre)}</span><span class="date">${esc(f)}</span></div>
          <span class="pill p-${est}">${est}</span>
          <dl>
            <dt>WhatsApp</dt><dd>${esc(r.tel)}</dd><dt>Email</dt><dd>${esc(r.email)}</dd><dt>Ciudad</dt><dd>${esc(r.ciudad)}</dd>
            <dt>Modelo</dt><dd>${esc(r.tipo)}${r.recomendado ? ` · recomendado: ${esc(r.recomendado)}` : ''}</dd>
            <dt>Ancho</dt><dd>${r.ancho_cm ? esc(r.ancho_cm) + ' cm' : '—'}</dd><dt>Instalación</dt><dd>${r.instalacion === 'no' ? 'Solo envío' : 'Con instalador'}</dd>
            ${r.mensaje ? `<dt>Comentario</dt><dd>${esc(r.mensaje)}</dd>` : ''}
          </dl>
          <div class="acts">
            <a class="btn wa" href="https://wa.me/${waNum(r.tel)}?text=${msg}" target="_blank" rel="noopener">Responder por WhatsApp</a>
            ${est !== 'contactada' ? `<button class="btn line" data-id="${r.id}" data-s="contactada">Marcar contactada</button>` : ''}
            ${est !== 'cerrada' ? `<button class="btn line" data-id="${r.id}" data-s="cerrada">Marcar cerrada</button>` : ''}
          </div></div></article>`;
      }).join('');
    }
    $('list').addEventListener('click', async e => {
      const im = e.target.closest('.imgs img');
      if (im) { $('zoom').querySelector('img').src = im.src; $('zoom').hidden = false; return; }
      const b = e.target.closest('button[data-id]'); if (!b) return;
      b.disabled = true;
      try { await updateDoc(doc(db, 'consultas', b.dataset.id), { estado: b.dataset.s }); } catch (ex) { b.disabled = false; alert('No se pudo actualizar.'); }
    });
    $('zoom').addEventListener('click', () => $('zoom').hidden = true);
  }
</script>
</body>
